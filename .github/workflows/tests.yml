name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python3.10
        run: uv python install 3.10
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
        env:
          FORCE_COLOR: 1

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python3.10
        run: uv python install 3.10
      - run: uv sync --group dev
      - run: uv run mypy
        env:
          FORCE_COLOR: 1

  tests-on-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --group uvloop
      - run: >-
          uv run pytest \
            -vv \
            --cov=aiomisc_pytest \
            --cov-report=term-missing \
            tests
        env:
          FORCE_COLOR: 1

  tests-on-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false

      matrix:
        python:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev
      - run: >-
          uv run pytest \
            -vv \
            --cov=aiomisc_pytest \
            --cov-report=term-missing \
            tests
        env:
          FORCE_COLOR: 1

  tests-on-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false

      matrix:
        python:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup python${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev
      - run: >-
          uv run pytest -vv --cov=aiomisc_pytest --cov-report=term-missing tests
        env:
          FORCE_COLOR: 1
