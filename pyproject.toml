[project]
name = "aiomisc-pytest"
version = "2.0.0"
description = "pytest integration for aiomisc"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Dmitry Orlov", email = "me@mosquito.su"}
]
keywords = ["pytest", "aiomisc"]
classifiers = [
    "Environment :: Plugins",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.4",
    "aiomisc>=18",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.21"]

[project.entry-points.pytest11]
aiomisc = "aiomisc_pytest"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]
uvloop = ["uvloop>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["aiomisc_pytest.py"]

[tool.hatch.build.targets.sdist]
only-include = ["aiomisc_pytest.py", "README.md", "COPYING", "pyproject.toml"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
follow_imports = "silent"
no_implicit_reexport = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["aiomisc_pytest.py"]

[[tool.mypy.overrides]]
module = "uvloop"
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
]
ignore = [
    "E252",   # missing whitespace around parameter equals
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["aiomisc_pytest"]
